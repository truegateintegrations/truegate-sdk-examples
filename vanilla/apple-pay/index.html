<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Truegate SDK — Apple Pay example</title>
    <link
      rel="stylesheet"
      href="/src/style.css"
    />
  </head>
  <body>
    <main class="page">
      <h1>Apple Pay</h1>
      <p
        id="status"
        class="status"
      >
        Loading…
      </p>

      <!-- The SDK injects Apple's own <apple-pay-button> element into this container. -->
      <div
        id="apple-pay-button"
        class="apple-pay-button"
      ></div>
    </main>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
